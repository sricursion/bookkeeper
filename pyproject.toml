[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munim"
version = "0.1.0"
description = "A deterministic bookkeeper that stands between an agent and a merchant's money on Razorpay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
munim = "munim.cli:main"

[tool.setuptools.packages.find]
include = ["munim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
